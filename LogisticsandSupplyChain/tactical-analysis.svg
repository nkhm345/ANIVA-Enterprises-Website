<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Ubuntu, 'Segoe UI', Tahoma, sans-serif">
  <defs>
    <marker id="ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9AA0B3"/>
    </marker>
    <marker id="taN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#23263B"/>
    </marker>
    <marker id="taO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#FFFFFF"/>
  <text x="490" y="42" text-anchor="middle" font-size="21" font-weight="700" fill="#23263B">Tactical inbound optimization &#8212; route, cube &amp; mode</text>
  <text x="490" y="66" text-anchor="middle" font-size="13" fill="#636363">Illustrative &#8212; consolidate direct shipments into milk runs, fill the cube, and pick the right mode</text>

  <!-- ===== LEFT: before ===== -->
  <rect x="40" y="92" width="430" height="330" rx="14" fill="#F7F8FB" stroke="#E1E5EC"/>
  <text x="255" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#636363" letter-spacing="1">BEFORE &#8212; DIRECT, ONE-OFF SHIPMENTS</text>
  <!-- plant -->
  <rect x="90" y="235" width="46" height="46" rx="6" fill="#23263B"/>
  <text x="113" y="300" text-anchor="middle" font-size="11.5" fill="#636363">Plant / DC</text>
  <!-- six suppliers each with own truck line -->
  <g stroke="#C4C9D6" stroke-width="1.8" fill="none" marker-end="url(#ta)">
    <path d="M330 150 C 250 165, 180 205, 140 243"/>
    <path d="M370 205 C 290 215, 205 230, 140 252"/>
    <path d="M395 258 L140 258"/>
    <path d="M380 315 C 300 305, 210 285, 140 266"/>
    <path d="M330 370 C 260 350, 185 310, 138 275"/>
    <path d="M255 385 C 215 355, 175 315, 132 283"/>
  </g>
  <g fill="#FFFFFF" stroke="#6B7390" stroke-width="1.6">
    <circle cx="338" cy="148" r="11"/><circle cx="378" cy="204" r="11"/><circle cx="404" cy="258" r="11"/><circle cx="388" cy="316" r="11"/><circle cx="337" cy="371" r="11"/><circle cx="262" cy="388" r="11"/>
  </g>
  <text x="255" y="410" text-anchor="middle" font-size="11.5" fill="#9AA0B3">6 suppliers &#183; 6 part-full trucks &#183; empty miles</text>

  <!-- arrow -->
  <path d="M482 255 h30" stroke="#F5A623" stroke-width="5" fill="none" marker-end="url(#taO)"/>

  <!-- ===== RIGHT: after ===== -->
  <rect x="530" y="92" width="410" height="330" rx="14" fill="#FFFFFF" stroke="#F5A623" stroke-width="2"/>
  <text x="735" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#23263B" letter-spacing="1">AFTER &#8212; CONSOLIDATED MILK RUNS</text>
  <rect x="580" y="235" width="46" height="46" rx="6" fill="#23263B"/>
  <text x="603" y="300" text-anchor="middle" font-size="11.5" fill="#636363">Plant / DC</text>
  <!-- milk run 1 (north loop) -->
  <path d="M626 245 C 690 175, 800 140, 855 175 C 885 200, 850 225, 800 232 C 745 240, 680 250, 626 253" stroke="#23263B" stroke-width="2.4" fill="none" marker-end="url(#taN)"/>
  <!-- milk run 2 (south loop) -->
  <path d="M626 272 C 690 330, 790 380, 855 350 C 885 330, 845 305, 795 296 C 745 288, 680 278, 626 266" stroke="#F5A623" stroke-width="2.4" fill="none" marker-end="url(#taO)"/>
  <g fill="#FFFFFF" stroke="#6B7390" stroke-width="1.6">
    <circle cx="742" cy="163" r="11"/><circle cx="852" cy="176" r="11"/><circle cx="800" cy="232" r="11"/>
    <circle cx="745" cy="352" r="11"/><circle cx="851" cy="349" r="11"/><circle cx="795" cy="296" r="11"/>
  </g>
  <text x="735" y="410" text-anchor="middle" font-size="11.5" fill="#636363">2 milk runs &#183; full cube &#183; right mode &#183; fewer trucks</text>

  <!-- outcome chips -->
  <g font-size="13" font-weight="700">
    <rect x="145" y="455" width="200" height="34" rx="17" fill="#FFF4E0" stroke="#FFE1A8"/>
    <text x="245" y="477" text-anchor="middle" fill="#D98C00">Trucks required &#9660;</text>
    <rect x="390" y="455" width="200" height="34" rx="17" fill="#EEF1F7" stroke="#D5D9E3"/>
    <text x="490" y="477" text-anchor="middle" fill="#23263B">Cube utilization &#9650;</text>
    <rect x="635" y="455" width="200" height="34" rx="17" fill="#FFF4E0" stroke="#FFE1A8"/>
    <text x="735" y="477" text-anchor="middle" fill="#D98C00">Cost per unit &#9660;</text>
  </g>
  <text x="490" y="522" text-anchor="middle" font-size="12" fill="#9AA0B3">Route &#183; cube &#183; frequency &#183; mode &#8212; optimized with commercial planning software, within production and dock constraints</text>
</svg>
