<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="Ubuntu, 'Segoe UI', Tahoma, sans-serif">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D2E"/>
      <stop offset="0.55" stop-color="#23263B"/>
      <stop offset="1" stop-color="#2E3352"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#23263B" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#23263B"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F5A623"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1400" height="700" fill="#FFFFFF"/>
  <g transform="translate(0,-118)">

  <!-- title -->

  <!-- ===== stage cards ===== -->
  <!-- geometry: 6 cards, x = 40 + i*226, width 200, top 140, height 360 -->

  <!-- connector arrows between cards -->
  <g stroke="#23263B" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="242" y1="320" x2="262" y2="320"/>
    <line x1="468" y1="320" x2="488" y2="320"/>
    <line x1="694" y1="320" x2="714" y2="320"/>
    <line x1="920" y1="320" x2="940" y2="320"/>
    <line x1="1146" y1="320" x2="1166" y2="320"/>
  </g>

  <!-- STAGE 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="140" width="200" height="360" rx="14" fill="#FFFFFF" stroke="#E1E5EC"/>
    <path d="M40 154 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v58 h-200 z" fill="url(#navy)"/>
  </g>
  <circle cx="68" cy="176" r="16" fill="#F5A623"/>
  <text x="68" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D2E">1</text>
  <text x="94" y="172" font-size="15" font-weight="700" fill="#FFFFFF">Align &amp; Scope</text>
  <text x="94" y="191" font-size="11" fill="#B1B6C7">Week 1</text>
  <g font-size="12.5" fill="#4A4F63">
    <text x="58" y="238">• Kick-off with leadership and</text>
    <text x="58" y="255">  a core client team</text>
    <text x="58" y="278">• Problem statement, scope</text>
    <text x="58" y="295">  and deliverables</text>
    <text x="58" y="318">• Agree the baseline that</text>
    <text x="58" y="335">  value will be measured against</text>
    <text x="58" y="358">• Weekly review cadence set</text>
  </g>
  <text x="58" y="412" font-size="11" font-style="italic" fill="#9AA0B3">e.g. scope document, bid</text>
  <text x="58" y="427" font-size="11" font-style="italic" fill="#9AA0B3">project plan, SOW for a pilot</text>
  <rect x="58" y="456" width="164" height="26" rx="13" fill="#FFF4E0" stroke="#FFE1A8"/>
  <text x="140" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#D98C00">SIGN-OFF: SCOPE &amp; BASELINE</text>

  <!-- STAGE 2 -->
  <g filter="url(#shadow)">
    <rect x="266" y="140" width="200" height="360" rx="14" fill="#FFFFFF" stroke="#E1E5EC"/>
    <path d="M266 154 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v58 h-200 z" fill="url(#navy)"/>
  </g>
  <circle cx="294" cy="176" r="16" fill="#F5A623"/>
  <text x="294" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D2E">2</text>
  <text x="320" y="172" font-size="15" font-weight="700" fill="#FFFFFF">Discover</text>
  <text x="320" y="191" font-size="11" fill="#B1B6C7">Weeks 1–3 • on site</text>
  <g font-size="12.5" fill="#4A4F63">
    <text x="284" y="238">• Walk the operation; interview</text>
    <text x="284" y="255">  process owners and stakeholders</text>
    <text x="284" y="278">• Map the current state —</text>
    <text x="284" y="295">  flows, hand-offs, pain points</text>
    <text x="284" y="318">• Capture and cleanse the data</text>
    <text x="284" y="335">  (iterate until it reconciles)</text>
    <text x="284" y="358">• Benchmark against targets</text>
  </g>
  <text x="284" y="412" font-size="11" font-style="italic" fill="#9AA0B3">e.g. lane files, order-level</text>
  <text x="284" y="427" font-size="11" font-style="italic" fill="#9AA0B3">P&amp;L data, time &amp; payroll data</text>
  <rect x="284" y="456" width="164" height="26" rx="13" fill="#EEF1F7" stroke="#D5D9E3"/>
  <text x="366" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#23263B">SINGLE SOURCE OF TRUTH</text>

  <!-- STAGE 3 -->
  <g filter="url(#shadow)">
    <rect x="492" y="140" width="200" height="360" rx="14" fill="#FFFFFF" stroke="#E1E5EC"/>
    <path d="M492 154 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v58 h-200 z" fill="url(#navy)"/>
  </g>
  <circle cx="520" cy="176" r="16" fill="#F5A623"/>
  <text x="520" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D2E">3</text>
  <text x="546" y="172" font-size="15" font-weight="700" fill="#FFFFFF">Model &amp; Analyze</text>
  <text x="546" y="191" font-size="11" fill="#B1B6C7">Weeks 3–6</text>
  <g font-size="12.5" fill="#4A4F63">
    <text x="510" y="238">• Build the model that fits</text>
    <text x="510" y="255">  the question</text>
    <text x="510" y="278">• Run what-if scenarios and</text>
    <text x="510" y="295">  quantify the opportunity</text>
    <text x="510" y="318">• Rank markets, lanes, carriers,</text>
    <text x="510" y="335">  customers or labor by value</text>
    <text x="510" y="358">• Validate findings with finance</text>
  </g>
  <text x="510" y="412" font-size="11" font-style="italic" fill="#9AA0B3">e.g. Network Value Model / TSC,</text>
  <text x="510" y="427" font-size="11" font-style="italic" fill="#9AA0B3">bid scorecards, labor demand tool</text>
  <rect x="510" y="456" width="164" height="26" rx="13" fill="#EEF1F7" stroke="#D5D9E3"/>
  <text x="592" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#23263B">QUANTIFIED OPPORTUNITY</text>

  <!-- STAGE 4 -->
  <g filter="url(#shadow)">
    <rect x="718" y="140" width="200" height="360" rx="14" fill="#FFFFFF" stroke="#E1E5EC"/>
    <path d="M718 154 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v58 h-200 z" fill="url(#navy)"/>
  </g>
  <circle cx="746" cy="176" r="16" fill="#F5A623"/>
  <text x="746" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D2E">4</text>
  <text x="772" y="172" font-size="15" font-weight="700" fill="#FFFFFF">Design</text>
  <text x="772" y="191" font-size="11" fill="#B1B6C7">Weeks 5–8</text>
  <g font-size="12.5" fill="#4A4F63">
    <text x="736" y="238">• Future-state network, process</text>
    <text x="736" y="255">  or strategy</text>
    <text x="736" y="278">• Business rules, RACI and</text>
    <text x="736" y="295">  standard operating procedures</text>
    <text x="736" y="318">• Pressure-test with the people</text>
    <text x="736" y="335">  who will run it</text>
    <text x="736" y="358">• KPIs defined up front</text>
  </g>
  <text x="736" y="412" font-size="11" font-style="italic" fill="#9AA0B3">e.g. bid strategy &amp; packages,</text>
  <text x="736" y="427" font-size="11" font-style="italic" fill="#9AA0B3">order-to-cash SOP, routing design</text>
  <rect x="736" y="456" width="164" height="26" rx="13" fill="#FFF4E0" stroke="#FFE1A8"/>
  <text x="818" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#D98C00">SIGN-OFF: DESIGN BUY-IN</text>

  <!-- STAGE 5 -->
  <g filter="url(#shadow)">
    <rect x="944" y="140" width="200" height="360" rx="14" fill="#FFFFFF" stroke="#E1E5EC"/>
    <path d="M944 154 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v58 h-200 z" fill="url(#navy)"/>
  </g>
  <circle cx="972" cy="176" r="16" fill="#F5A623"/>
  <text x="972" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D2E">5</text>
  <text x="998" y="172" font-size="15" font-weight="700" fill="#FFFFFF">Implement</text>
  <text x="998" y="191" font-size="11" fill="#B1B6C7">Weeks 8–12</text>
  <g font-size="12.5" fill="#4A4F63">
    <text x="962" y="238">• Run the bid, pilot the process,</text>
    <text x="962" y="255">  deploy the tool</text>
    <text x="962" y="278">• Train super-users and</text>
    <text x="962" y="295">  operating teams</text>
    <text x="962" y="318">• Award, on-board, load the</text>
    <text x="962" y="335">  routing guide or system</text>
    <text x="962" y="358">• Side by side until it sticks</text>
  </g>
  <text x="962" y="412" font-size="11" font-style="italic" fill="#9AA0B3">e.g. two-round RFQ &amp; awards,</text>
  <text x="962" y="427" font-size="11" font-style="italic" fill="#9AA0B3">sandbox pilot, super-user hand-over</text>
  <rect x="962" y="456" width="164" height="26" rx="13" fill="#EEF1F7" stroke="#D5D9E3"/>
  <text x="1044" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#23263B">LIVE &amp; IN THE CLIENT'S HANDS</text>

  <!-- STAGE 6 -->
  <g filter="url(#shadow)">
    <rect x="1170" y="140" width="200" height="360" rx="14" fill="#FFFFFF" stroke="#E1E5EC"/>
    <path d="M1170 154 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v58 h-200 z" fill="url(#navy)"/>
  </g>
  <circle cx="1198" cy="176" r="16" fill="#F5A623"/>
  <text x="1198" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1D2E">6</text>
  <text x="1224" y="172" font-size="15" font-weight="700" fill="#FFFFFF">Measure &amp; Sustain</text>
  <text x="1224" y="191" font-size="11" fill="#B1B6C7">Ongoing</text>
  <g font-size="12.5" fill="#4A4F63">
    <text x="1188" y="238">• Savings and service tracked</text>
    <text x="1188" y="255">  against the agreed baseline</text>
    <text x="1188" y="278">• KPI dashboard, monthly and</text>
    <text x="1188" y="295">  quarterly reviews</text>
    <text x="1188" y="318">• Refreshable models the client</text>
    <text x="1188" y="335">  re-runs on its own</text>
    <text x="1188" y="358">• Lessons learned, next wave</text>
  </g>
  <text x="1188" y="412" font-size="11" font-style="italic" fill="#9AA0B3">e.g. cost-control tracker, board</text>
  <text x="1188" y="427" font-size="11" font-style="italic" fill="#9AA0B3">dashboard, quarterly business reviews</text>
  <rect x="1188" y="456" width="164" height="26" rx="13" fill="#FFF4E0" stroke="#FFE1A8"/>
  <text x="1270" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#D98C00">SIGN-OFF: VALUE DELIVERED</text>

  <!-- ===== feedback loop: 6 back to 3 ===== -->
  <path d="M1270 500 V 540 H 592 V 500" fill="none" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
  <rect x="770" y="526" width="322" height="28" rx="14" fill="#FFFFFF" stroke="#F5A623"/>
  <text x="931" y="545" text-anchor="middle" font-size="12" font-weight="700" fill="#D98C00">MEASURE → REFINE → REPEAT  (continuous improvement)</text>

  <!-- ===== what the client owns ===== -->
  <rect x="40" y="592" width="1330" height="196" rx="16" fill="url(#navy)"/>
  <text x="70" y="626" font-size="12" font-weight="700" letter-spacing="3" fill="#F5A623">WHAT YOU OWN WHEN WE LEAVE</text>
  <text x="70" y="650" font-size="17" font-weight="700" fill="#FFFFFF">A repeatable process — not a report</text>
  <g font-size="12.5" fill="#DFE2EB">
    <!-- six columns aligned to the cards -->
    <text x="70"   y="690" font-weight="700" fill="#FFFFFF">Scope &amp; baseline</text>
    <text x="70"   y="708">Agreed targets, project plan,</text>
    <text x="70"   y="724">review cadence</text>

    <text x="290"  y="690" font-weight="700" fill="#FFFFFF">Clean data set</text>
    <text x="290"  y="708">Validated, reusable lane /</text>
    <text x="290"  y="724">order / labor data</text>

    <text x="510"  y="690" font-weight="700" fill="#FFFFFF">Models &amp; scenarios</text>
    <text x="510"  y="708">Excel / BI models that</text>
    <text x="510"  y="724">refresh monthly or quarterly</text>

    <text x="730"  y="690" font-weight="700" fill="#FFFFFF">Designs, SOPs &amp; RACI</text>
    <text x="730"  y="708">Documented future state,</text>
    <text x="730"  y="724">rules and ownership</text>

    <text x="950"  y="690" font-weight="700" fill="#FFFFFF">Live tools &amp; trained team</text>
    <text x="950"  y="708">Super-users, contracts,</text>
    <text x="950"  y="724">routing guides, pilots</text>

    <text x="1170" y="690" font-weight="700" fill="#FFFFFF">KPIs &amp; governance</text>
    <text x="1170" y="708">Dashboard, savings tracker,</text>
    <text x="1170" y="724">monthly / quarterly reviews</text>
  </g>
  <line x1="70" y1="748" x2="1340" y2="748" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="70" y="772" font-size="12" fill="#B1B6C7">Proven across oil &amp; gas, chemicals, automotive, beverage, retail, trucking, air cargo, industrial services and consumer products • 5–10% typical savings on logistics &amp; supply chain spend</text>

  <!-- footer -->
  </g>
</svg>
